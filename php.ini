expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 192M
max_execution_time = 30
upload_max_filesize = 12M
post_max_size = 14M
allow_url_fopen = Off
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_samesite = Lax
open_basedir = /var/www/html:/tmp
disable_functions = exec,system,passthru,shell_exec,proc_open,popen,pcntl_exec,putenv,dl
