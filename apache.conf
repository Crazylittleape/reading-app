ServerName reading-app.local
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html
    DirectoryIndex index.html
    AllowEncodedSlashes Off
    LimitRequestBody 14680064
    <Directory /var/www/html>
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted
        AcceptPathInfo On
    </Directory>
    <DirectoryMatch "^/var/www/html/(?:sys|template|caches)(?:/|$)">
        Require all denied
    </DirectoryMatch>
    <DirectoryMatch "^/var/www/html/(?:attachment|packs|app)(?:/|$)">
        <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>
    <FilesMatch "(?i)^(?!index\.php$|manage\.php$).*\.(?:php[0-9]*|phtml|phar|sql|bak|log|ini|env)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    RewriteEngine On
    RewriteRule ^/?$ /app/ [R=302,L]
    RewriteCond %{REQUEST_URI} ^/index\.php [NC]
    RewriteCond %{REQUEST_URI} !^/index\.php/appv1/(?:book/(?:index|data|info|chapter|read|type|tags|search)|comic/(?:index|data|info|chapter|read|type|search)|kxapps/(?:type|notice)|init/(?:update|kefu|txt))/?$ [NC]
    RewriteRule ^ - [F,L]
    RewriteCond %{REQUEST_URI} ^/manage\.php/(?:update|skins|backups|sys|caiji|generate|setting|app/setting|ajax/(?:push|mailadd)) [NC]
    RewriteRule ^ - [F,L]
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
